name: India Classification Targeted Smoke Test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'workers/india_targeted_smoke_test.py'
      - '.github/workflows/india-classification-smoke-test.yml'

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install requests
        run: python -m pip install 'requests==2.32.5'

      - name: Run targeted exchange smoke test
        run: python workers/india_targeted_smoke_test.py
