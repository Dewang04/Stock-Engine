name: India Exchange Browser Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'workers/india_exchange_browser_worker.py'
      - '.github/workflows/india-exchange-browser-worker.yml'
      - 'requirements.txt'
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: read

concurrency:
  group: stock-engine-india-exchange-worker
  cancel-in-progress: false

jobs:
  validate-india-exchanges:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run browser worker
        env:
          SUPABASE_FUNCTION_URL: ${{ secrets.SUPABASE_FUNCTION_URL }}
          GPEIS_WORKER_TOKEN: ${{ secrets.GPEIS_WORKER_TOKEN }}
          BATCH_SIZE: '5'
        run: python workers/india_exchange_browser_worker.py

      - name: Worker summary
        if: always()
        run: echo "India exchange classification worker finished; inspect the run logs for per-record results."