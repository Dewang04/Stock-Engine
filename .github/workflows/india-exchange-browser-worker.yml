name: India Exchange Targeted Smoke Test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'workers/india_targeted_smoke_test.py'
      - '.github/workflows/india-exchange-browser-worker.yml'

permissions:
  contents: read

concurrency:
  group: stock-engine-india-targeted-smoke-test
  cancel-in-progress: true

jobs:
  targeted-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install requests
        run: python -m pip install --disable-pip-version-check requests==2.32.5

      - name: Run targeted NSE/BSE smoke test
        run: python workers/india_targeted_smoke_test.py
